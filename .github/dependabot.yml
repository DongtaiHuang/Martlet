# Weekly dependency updates. Minor and patch npm bumps come as one grouped PR;
# majors arrive separately so they can be reviewed on their own. CI must pass first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Production runs Node 22 (package.json engines); newer types would allow APIs it lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Wait until Next.js supports the next TypeScript major (TypeScript 7 fails the build).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

